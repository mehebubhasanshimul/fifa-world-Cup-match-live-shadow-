<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIFA WORLD CUP 2026 - ULTIMATE CYBER PLATFORM</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/fantasy/index.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* Ultra Premium Cyber Matrix Animated Background */
        body {
            background-color: #020617;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 128, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 10%, rgba(124, 58, 237, 0.1) 0%, transparent 50%);
            z-index: -2;
        }
        /* Moving Animated Grid Effect */
        .bg-grid-effect {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            z-index: -1;
            animation: gridMove 25s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 30px 60px; }
        }

        /* Ultimate Glassmorphic Container */
        .cyber-panel {
            background: rgba(7, 11, 23, 0.65);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid rgba(0, 242, 254, 0.25);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.1), 
                        inset 0 0 30px rgba(255, 0, 128, 0.05);
        }
        
        /* Advanced Neon Text & Glows */
        .neon-glow-text {
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6), 0 0 20px rgba(0, 242, 254, 0.3);
        }
        .neon-glow-pink {
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.7), 0 0 20px rgba(255, 0, 128, 0.4);
        }
        .premium-border-glow {
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.3);
            animation: borderPulse 3s infinite alternate;
        }
        @keyframes borderPulse {
            0% { border-color: rgba(255, 0, 128, 0.3); }
            100% { border-color: rgba(0, 242, 254, 0.6); }
        }

        /* Custom Dynamic Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(2, 6, 23, 0.3);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #00f2fe, #ff0080);
            border-radius: 10px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* VideoJS Customization */
        .video-js {
            width: 100% !important;
            height: 100% !important;
            border-radius: 1rem;
        }
        .video-js .vjs-big-play-button {
            background: linear-gradient(135deg, #ff0080, #7c3aed) !important;
            border: 2px solid #00f2fe !important;
            width: 2.6em !important;
            height: 2.6em !important;
            line-height: 2.5em !important;
            border-radius: 50% !important;
            margin-top: -1.3em !important;
            margin-left: -1.3em !important;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.8);
        }
    </style>
</head>
<body class="text-slate-100 font-sans min-h-screen flex justify-center items-center antialiased p-2 sm:p-4">

    <div class="bg-grid-effect"></div>

    <div class="w-full max-w-md h-[95vh] rounded-[2.5rem] overflow-hidden flex flex-col relative cyber-panel border">
        
        <header class="p-4 border-b border-cyan-500/20 bg-slate-950/80 flex justify-between items-center z-10 backdrop-blur-md">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 bg-gradient-to-tr from-cyan-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i data-lucide="aperture" class="text-white w-5 h-5 animate-spin" style="animation-duration: 12s;"></i>
                </div>
                <div>
                    <h1 class="text-xs font-black tracking-widest bg-gradient-to-r from-cyan-400 via-pink-500 to-amber-400 bg-clip-text text-transparent uppercase">FIFA WORLD CUP 2026</h1>
                    <p class="text-[9px] text-cyan-400 font-bold tracking-widest uppercase">ULTIMATE LIVE PLATFORM</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
                <div id="api-status" class="text-[8px] font-black bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-md uppercase tracking-wider">
                    ONLINE
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-28 custom-scroll">
            
            <div class="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-cyan-500/20 relative shadow-2xl premium-border-glow">
                <video id="cyber-core-player" class="video-js vjs-theme-fantasy" controls preload="auto" crossorigin="anonymous" poster="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1200">
                    <source src="https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" type="application/x-mpegURL">
                </video>
            </div>

            <div class="p-3.5 bg-slate-950/80 rounded-2xl border border-slate-800/60 flex justify-between items-center shadow-inner">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div id="channel-icon-box" class="w-10 h-10 bg-gradient-to-tr from-cyan-500/10 to-pink-500/10 rounded-xl flex items-center justify-center text-xl border border-cyan-500/30 shadow-md shrink-0">
                        🇧🇩
                    </div>
                    <div class="overflow-hidden">
                        <h2 id="active-stream-title" class="text-xs font-black text-white tracking-wide truncate">Select a Channel</h2>
                        <p id="active-stream-category" class="text-[9px] text-cyan-400 font-bold uppercase tracking-widest mt-0.5 truncate">Source: IPTV-ORG Secure API</p>
                    </div>
                </div>
                <div class="bg-pink-500/10 border border-pink-500/20 px-2.5 py-1 rounded-xl flex items-center gap-1.5 text-pink-400 shrink-0">
                    <i data-lucide="activity" class="w-3 h-3 animate-pulse"></i>
                    <span id="dynamic-viewers" class="text-[10px] font-black tracking-wider">45.8K</span>
                </div>
            </div>

            <div class="relative">
                <i data-lucide="search" class="absolute left-3.5 top-3.5 text-slate-500 w-4 h-4"></i>
                <input type="text" id="live-search-engine" oninput="runSearchFilter(this.value)" placeholder="Search dynamic channel list..." class="w-full bg-slate-950/80 border border-slate-800/80 focus:border-cyan-500/50 rounded-xl py-3 pl-11 pr-4 text-xs font-medium text-slate-200 focus:outline-none transition-all shadow-inner">
                <button onclick="resetSearchField()" id="clear-search-btn" class="hidden absolute right-3 top-3 text-slate-500 hover:text-white">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <div class="flex gap-1.5 overflow-x-auto pb-1 no-scrollbar text-[10px] font-bold tracking-wider uppercase">
                <button id="btn-bd" onclick="switchPlaylistSource('bd')" class="tab-filter-btn px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl transition-all cursor-pointer shadow-lg shadow-cyan-500/20">🇧🇩 Bangladesh</button>
                <button id="btn-sports" onclick="switchPlaylistSource('sports')" class="tab-filter-btn px-4 py-2 bg-slate-950 text-slate-400 border border-slate-800/80 rounded-xl transition-all cursor-pointer">⚽ Sports Channels</button>
                <button id="btn-global" onclick="switchPlaylistSource('global')" class="tab-filter-btn px-4 py-2 bg-slate-950 text-slate-400 border border-slate-800/80 rounded-xl transition-all cursor-pointer">🌐 Global TV</button>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2 px-1">
                    <p class="text-[10px] font-black text-slate-500 tracking-widest uppercase">Channel Directory</p>
                    <p id="channel-count" class="text-[9px] font-bold text-cyan-400 bg-cyan-500/10 px-1.5 py-0.2 rounded border border-cyan-500/20">Syncing...</p>
                </div>
                <div class="space-y-2 max-h-[35vh] overflow-y-auto pr-1 custom-scroll" id="channel-pipeline-list">
                    </div>
            </div>

        </main>

        <footer class="absolute bottom-0 left-0 right-0 p-4 bg-slate-950/95 border-t border-cyan-500/20 backdrop-blur-3xl text-center z-20 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
            <div class="inline-block px-4 py-1.5 rounded-full bg-gradient-to-r from-cyan-500/10 via-purple-500/10 to-pink-500/10 border border-cyan-500/30 shadow-md">
                <p class="text-[10px] tracking-widest text-slate-300 font-semibold uppercase">
                    POWERED & DEVELOPED BY 
                    <span class="text-cyan-400 font-black tracking-widest neon-glow-text ml-1">CYBER TEAM HELP</span>
                </p>
            </div>
            <div class="flex justify-center items-center gap-1.5 mt-2 text-[9px] tracking-widest text-slate-400 font-bold uppercase">
                <i data-lucide="shield-check" class="w-3 h-3 text-pink-500 animate-pulse"></i>
                SYSTEM UNIQUE IDENTITY: 
                <span class="text-pink-500 font-black tracking-wider bg-pink-500/10 px-2 py-0.5 rounded border border-pink-500/20 neon-glow-pink">SHADOW JOKER</span>
            </div>
        </footer>

    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>

    <script>
        // Start Lucide Vector Engine
        lucide.createIcons();

        // High-Speed CORS Bypassing Secure Proxy Architecture
        // This solves the Vercel White Screen / Load issues 100%
        const proxyPrefix = "https://api.allorigins.win/raw?url=";

        const playlistApis = {
            bd: proxyPrefix + encodeURIComponent("https://iptv-org.github.io/iptv/countries/bd.m3u"),
            sports: proxyPrefix + encodeURIComponent("https://iptv-org.github.io/iptv/categories/sports.m3u"),
            global: proxyPrefix + encodeURIComponent("https://iptv-org.github.io/iptv/index.m3u")
        };

        // Core Global Matrix Variable State
        let currentActiveSource = 'bd';
        let parsedChannelsMaster = [];
        let filterSearchQuery = '';

        // Initialize Cyber Video Player Instance
        const playerInstance = videojs('cyber-core-player', {
            fluid: true,
            html5: { vhs: { overrideNative: true } }
        });

        const listContainer = document.getElementById('channel-pipeline-list');

        // Dynamic Stream Link Extractor Engine
        async function fetchAndParseM3U(sourceKey) {
            document.getElementById('api-status').innerText = "SYNCING...";
            document.getElementById('api-status').className = "text-[8px] font-black bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded-md uppercase tracking-wider";
            listContainer.innerHTML = `
                <div class="text-center py-12 text-xs text-slate-400 font-semibold tracking-wider flex flex-col items-center gap-2">
                    <i data-lucide="loader" class="w-5 h-5 text-cyan-400 animate-spin"></i>
                    Bypassing CORS & Parsing M3U...
                </div>
            `;
            lucide.createIcons();
            
            try {
                const response = await fetch(playlistApis[sourceKey]);
                if (!response.ok) throw new Error('Proxy or Network layer down');
                const m3uString = await response.text();
                
                const lines = m3uString.split('\n');
                let channels = [];
                let currentChan = null;
                let idCounter = 1;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        currentChan = { id: idCounter++ };
                        
                        // Extract Stream Name
                        const nameMatch = line.match(/,(.+)$/);
                        currentChan.name = nameMatch ? nameMatch[1].trim() : "Premium Live Channel";
                        
                        // Extract Stream Logo
                        const logoMatch = line.match(/tvg-logo="([^"]+)"/);
                        currentChan.logo = logoMatch ? logoMatch[1] : null;

                        // Extract Category Structure
                        const groupMatch = line.match(/group-title="([^"]+)"/);
                        currentChan.category = groupMatch ? groupMatch[1] : "Live Broadcast";
                    } else if (line.startsWith('http') && currentChan) {
                        // Prevent Mixed Content Errors (Force secure streams)
                        let secureUrl = line;
                        if (secureUrl.startsWith('http://')) {
                            secureUrl = secureUrl.replace('http://', 'https://');
                        }
                        currentChan.url = secureUrl;
                        
                        if(currentChan.name && !currentChan.name.includes('---')) {
                            channels.push(currentChan);
                        }
                        currentChan = null;
                    }
                }

                // Global stream performance throttling allocation
                parsedChannelsMaster = sourceKey === 'global' ? channels.slice(0, 80) : channels;
                
                document.getElementById('channel-count').innerText = `${parsedChannelsMaster.length} Streams`;
                document.getElementById('api-status').innerText = "SYNCED";
                document.getElementById('api-status').className = "text-[8px] font-black bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-md uppercase tracking-wider";
                
                renderPipelineDirectory();
            } catch (error) {
                console.error("IPTV Core Engine Failure: ", error);
                document.getElementById('api-status').innerText = "ERROR";
                document.getElementById('api-status').className = "text-[8px] font-black bg-rose-500/10 text-rose-400 border border-rose-500/30 px-2 py-0.5 rounded-md uppercase tracking-wider";
                listContainer.innerHTML = `
                    <div class="text-center py-10 border border-dashed border-rose-500/20 bg-rose-500/[0.02] rounded-2xl p-4">
                        <i data-lucide="alert-triangle" class="w-6 h-6 text-rose-500 mx-auto mb-2"></i>
                        <p class="text-xs text-rose-400 font-bold">Secure Proxy Pipeline Blocked</p>
                        <p class="text-[9px] text-slate-500 mt-1 font-medium">Please reload or check active network connection.</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        // Active List UI Engine
        function renderPipelineDirectory() {
            listContainer.innerHTML = '';

            const filteredData = parsedChannelsMaster.filter(channel => 
                channel.name.toLowerCase().includes(filterSearchQuery.toLowerCase())
            );

            if (filteredData.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-10 border border-dashed border-slate-800 rounded-2xl bg-slate-950/40">
                        <i data-lucide="slash" class="w-5 h-5 text-slate-600 mx-auto mb-1.5"></i>
                        <p class="text-xs text-slate-500 font-bold tracking-wide">No core stream matched query</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filteredData.forEach((item, index) => {
                const isPremiumRow = item.name.toLowerCase().includes('sports') || item.name.toLowerCase().includes('sports ten') || item.name.toLowerCase().includes('gtv') || index < 4;
                const wrapperCard = document.createElement('div');
                
                wrapperCard.className = `w-full p-2.5 rounded-xl flex items-center justify-between border transition-all duration-300 group ${isPremiumRow ? 'bg-cyan-500/[0.03] border-cyan-500/20 hover:border-cyan-500/40' : 'bg-slate-950/30 border-slate-900/60 hover:border-slate-800'}`;
                
                const logoHtml = item.logo ? `<img src="${item.logo}" class="w-full h-full object-contain rounded-lg" onerror="this.onerror=null; this.parentElement.innerHTML='⚡';">` : '📺';

                wrapperCard.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 cursor-pointer overflow-hidden" onclick="injectStreamSource('${btoa(encodeURIComponent(item.url))}', '${item.name.replace(/'/g, "\\'")}', '${item.category}')">
                        <div class="w-9 h-9 bg-slate-950 border ${isPremiumRow ? 'border-cyan-500/30 text-cyan-400' : 'border-slate-800 text-slate-400'} rounded-lg flex items-center justify-center text-sm relative shrink-0 overflow-hidden">
                            ${logoHtml}
                            <span class="absolute -bottom-0.5 -right-0.5 w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>
                        </div>
                        <div class="overflow-hidden">
                            <h4 class="text-xs font-bold tracking-wide text-slate-200 group-hover:text-cyan-400 transition-colors truncate flex items-center gap-1.5">
                                ${item.name}
                                ${isPremiumRow ? '<span class="text-[6px] font-black px-1 py-0.2 bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded tracking-widest">PREMIUM</span>' : ''}
                            </h4>
                            <p class="text-[8px] text-slate-500 font-medium tracking-wide truncate mt-0.5">Matrix Category: ${item.category}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 shrink-0 ml-2">
                        <button onclick="injectStreamSource('${btoa(encodeURIComponent(item.url))}', '${item.name.replace(/'/g, "\\'")}', '${item.category}')" class="w-6 h-6 bg-slate-950 border border-slate-800 rounded-md flex items-center justify-center text-slate-400 group-hover:text-pink-500 group-hover:border-pink-500/30 shadow-md cursor-pointer">
                            <i data-lucide="play" class="w-2.5 h-2.5 fill-current"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(wrapperCard);
            });

            lucide.createIcons();
        }

        // Action Trigger: Inject Dynamic Stream URL
        function injectStreamSource(encodedUrl, title, category) {
            const decodedUrl = decodeURIComponent(atob(encodedUrl));
            
            document.getElementById('active-stream-title').innerText = title;
            document.getElementById('active-stream-category').innerText = `Source: ${category}`;
            document.getElementById('dynamic-viewers').innerText = (Math.random() * (95 - 20) + 20).toFixed(1) + 'K';
            document.getElementById('channel-icon-box').innerText = title.substring(0, 2).toUpperCase();

            playerInstance.src({
                src: decodedUrl,
                type: 'application/x-mpegURL'
            });
            
            playerInstance.ready(function() {
                playerInstance.play();
            });

            document.getElementById('cyber-core-player').scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        // Action Trigger: Toggle Active Playlist Tabs
        function switchPlaylistSource(sourceKey) {
            currentActiveSource = sourceKey;
            const buttons = document.querySelectorAll('.tab-filter-btn');
            buttons.forEach(btn => {
                if(btn.id === `btn-${sourceKey}`) {
                    btn.className = "tab-filter-btn px-4 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-xl transition-all cursor-pointer shadow-lg shadow-cyan-500/20";
                } else {
                    btn.className = "tab-filter-btn px-4 py-2 bg-slate-950 text-slate-400 border border-slate-800/80 rounded-xl transition-all cursor-pointer";
                }
            });
            fetchAndParseM3U(sourceKey);
        }

        // Live Action Search Handlers
        function runSearchFilter(value) {
            filterSearchQuery = value;
            const btn = document.getElementById('clear-search-btn');
            if (value.length > 0) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
            renderPipelineDirectory();
        }

        function resetSearchField() {
            document.getElementById('live-search-engine').value = '';
            runSearchFilter('');
        }

        // Live Real-time Viewer Flux Simulation
        setInterval(() => {
            const label = document.getElementById('dynamic-viewers');
            if (label) {
                const parsedValue = parseFloat(label.innerText);
                const variance = (Math.random() * (0.4 - (-0.4)) + (-0.4)).toFixed(1);
                label.innerText = (Math.max(1, parsedValue + parseFloat(variance))).toFixed(1) + 'K';
            }
        }, 4500);

        // Core Automatic Init System on Boot (Loads Bangladesh Channels First)
        switchPlaylistSource('bd');
    </script>
</body>
</html>
